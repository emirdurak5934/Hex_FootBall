services:
  - type: web
    name: edyn-football
    runtime: python
    region: frankfurt
    plan: 0.5c-512mb
    numInstances: 1
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn --worker-class gthread --workers 1 --threads 20 --timeout 120 --bind 0.0.0.0:$PORT app:app
    healthCheckPath: /healthz
    autoDeployTrigger: commit
    disk:
      name: edyn-football-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: FOOTBALL_MATCH_SECRET_KEY
        generateValue: true
      - key: FOOTBALL_MATCH_PROFILE_DB
        value: /var/data/football_match.sqlite3
      - key: FLASK_ENV
        value: production
      - key: FOOTBALL_ADS_ENABLED
        value: "1"
      - key: FOOTBALL_AD_MODE
        value: test
