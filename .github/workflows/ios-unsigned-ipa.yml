name: Build unsigned iOS IPA

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "mobile-shell/**"
      - "static/**"
      - "templates/**"
      - "tools/build_mobile_bundle.py"
      - "app.py"
      - "ads.py"
      - "mobile-assets/**"
      - "capacitor.config.json"
      - "package.json"
      - "pnpm-lock.yaml"
      - ".github/workflows/ios-unsigned-ipa.yml"

jobs:
  build-unsigned-ipa:
    runs-on: macos-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.19.0

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build bundled mobile interface
        run: python3 tools/build_mobile_bundle.py

      - name: Generate and sync iOS project
        run: |
          pnpm exec cap add ios
          pnpm exec cap sync ios

      - name: Configure iOS AdMob
        env:
          ADMOB_IOS_APP_ID: ${{ secrets.ADMOB_IOS_APP_ID }}
        run: |
          PLIST="ios/App/App/Info.plist"
          APP_ID="${ADMOB_IOS_APP_ID:-ca-app-pub-3940256099942544~1458002511}"
          /usr/libexec/PlistBuddy -c "Set :GADApplicationIdentifier $APP_ID" "$PLIST" || \
            /usr/libexec/PlistBuddy -c "Add :GADApplicationIdentifier string $APP_ID" "$PLIST"
          /usr/libexec/PlistBuddy -c "Set :NSUserTrackingUsageDescription 'Reklamları daha ilgili hale getirmek için cihaz izni kullanılır.'" "$PLIST" || \
            /usr/libexec/PlistBuddy -c "Add :NSUserTrackingUsageDescription string 'Reklamları daha ilgili hale getirmek için cihaz izni kullanılır.'" "$PLIST"
          /usr/libexec/PlistBuddy -c "Add :SKAdNetworkItems array" "$PLIST" || true
          /usr/libexec/PlistBuddy -c "Add :SKAdNetworkItems:0 dict" "$PLIST" || true
          /usr/libexec/PlistBuddy -c "Set :SKAdNetworkItems:0:SKAdNetworkIdentifier cstr6suwn9.skadnetwork" "$PLIST" || \
            /usr/libexec/PlistBuddy -c "Add :SKAdNetworkItems:0:SKAdNetworkIdentifier string cstr6suwn9.skadnetwork" "$PLIST"

      - name: Apply Football Match HEX branding
        run: |
          ICON_SOURCE="mobile-assets/AppIcon-512@2x.png"
          ICON_TARGET="ios/App/App/Assets.xcassets/AppIcon.appiconset/AppIcon-512@2x.png"
          PLIST="ios/App/App/Info.plist"
          test -f "$ICON_SOURCE"
          cp "$ICON_SOURCE" "$ICON_TARGET"
          /usr/libexec/PlistBuddy -c "Set :CFBundleDisplayName 'Football Match: HEX'" "$PLIST" || \
            /usr/libexec/PlistBuddy -c "Add :CFBundleDisplayName string 'Football Match: HEX'" "$PLIST"

      - name: Build unsigned iPhone app
        run: >-
          xcodebuild
          -project ios/App/App.xcodeproj
          -scheme App
          -configuration Release
          -sdk iphoneos
          -destination 'generic/platform=iOS'
          -derivedDataPath build/DerivedData
          CODE_SIGNING_ALLOWED=NO
          CODE_SIGNING_REQUIRED=NO
          CODE_SIGN_IDENTITY=''
          build

      - name: Package unsigned IPA
        run: |
          APP_PATH="build/DerivedData/Build/Products/Release-iphoneos/App.app"
          test -d "$APP_PATH"
          mkdir -p build/Payload
          cp -R "$APP_PATH" build/Payload/FootballMatchHEX.app
          cd build
          ditto -c -k --sequesterRsrc --keepParent Payload Football-Match-HEX-unsigned.ipa

      - name: Upload unsigned IPA
        uses: actions/upload-artifact@v4
        with:
          name: Football-Match-HEX-unsigned-IPA
          path: build/Football-Match-HEX-unsigned.ipa
          if-no-files-found: error
          retention-days: 14
