name: iOS project validation

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "mobile-shell/**"
      - "capacitor.config.json"
      - "package.json"
      - "pnpm-lock.yaml"
      - ".github/workflows/ios-validate.yml"

jobs:
  validate-ios:
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.19.0

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate and sync iOS project
        run: |
          pnpm exec cap add ios
          pnpm exec cap sync ios

      - name: Configure iOS AdMob
        env:
          ADMOB_IOS_APP_ID: ${{ secrets.ADMOB_IOS_APP_ID }}
        run: |
          PLIST="ios/App/App/Info.plist"
          APP_ID="${ADMOB_IOS_APP_ID:-ca-app-pub-3940256099942544~1458002511}"
          /usr/libexec/PlistBuddy -c "Set :GADApplicationIdentifier $APP_ID" "$PLIST" || \
            /usr/libexec/PlistBuddy -c "Add :GADApplicationIdentifier string $APP_ID" "$PLIST"
          /usr/libexec/PlistBuddy -c "Set :NSUserTrackingUsageDescription 'Reklamları daha ilgili hale getirmek için cihaz izni kullanılır.'" "$PLIST" || \
            /usr/libexec/PlistBuddy -c "Add :NSUserTrackingUsageDescription string 'Reklamları daha ilgili hale getirmek için cihaz izni kullanılır.'" "$PLIST"
          /usr/libexec/PlistBuddy -c "Add :SKAdNetworkItems array" "$PLIST" || true
          /usr/libexec/PlistBuddy -c "Add :SKAdNetworkItems:0 dict" "$PLIST" || true
          /usr/libexec/PlistBuddy -c "Set :SKAdNetworkItems:0:SKAdNetworkIdentifier cstr6suwn9.skadnetwork" "$PLIST" || \
            /usr/libexec/PlistBuddy -c "Add :SKAdNetworkItems:0:SKAdNetworkIdentifier string cstr6suwn9.skadnetwork" "$PLIST"

      - name: Validate Xcode simulator build
        run: >-
          xcodebuild
          -project ios/App/App.xcodeproj
          -scheme App
          -destination 'generic/platform=iOS Simulator'
          -configuration Debug
          CODE_SIGNING_ALLOWED=NO
          build
