name: iOS project validation

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "mobile-shell/**"
      - "capacitor.config.json"
      - "package.json"
      - "pnpm-lock.yaml"
      - ".github/workflows/ios-validate.yml"

jobs:
  validate-ios:
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.19.0

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate and sync iOS project
        run: |
          pnpm exec cap add ios
          pnpm exec cap sync ios

      - name: Validate Xcode simulator build
        run: >-
          xcodebuild
          -project ios/App/App.xcodeproj
          -scheme App
          -destination 'generic/platform=iOS Simulator'
          -configuration Debug
          CODE_SIGNING_ALLOWED=NO
          build
