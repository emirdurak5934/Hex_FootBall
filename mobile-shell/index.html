<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#000000">
  <title>Football Match: HEX</title>
  <style>
    html,body{margin:0;min-height:100%;background:#070b13;color:#fff}
    #mobileTransitionError{position:fixed;inset:0;z-index:91000;display:grid;place-items:center;padding:22px;background:#02050b99;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
    #mobileTransitionError>div{width:min(100%,360px);padding:22px;border:1px solid #ffffff24;border-radius:18px;background:#111925;box-shadow:0 22px 70px #000b;text-align:center}
    #mobileTransitionError h2{margin:0 0 9px;font-size:20px}#mobileTransitionError p{margin:0 0 17px;color:#b8c1cc;line-height:1.45}
    #mobileTransitionError button{width:100%;min-height:48px;border:0;border-radius:11px;background:#d4a94e;color:#171207;font-weight:900}
  </style>
  <link rel="stylesheet" href="launcher.css">
</head>
<body>
  <main class="launcher" id="launcher" aria-hidden="true">
    <p class="eyebrow">FOOTBALL MATCH: HEX</p>
    <h1>Oyun açılıyor</h1>
    <p class="description">
      Paketlenmiş uygulama arayüzü hazırlanıyor.
    </p>
    <div class="spinner" aria-hidden="true"></div>
    <p id="message" class="message" role="status">Lütfen bekle…</p>
    <button id="retryButton" class="hidden" type="button">TEKRAR DENE</button>
  </main>
  <script src="launcher.js"></script>
</body>
</html>
