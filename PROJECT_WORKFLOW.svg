  <text class="small" x="497" y="1370">Native köprü + AdService</text>

  <rect class="node" x="675" y="1320" width="245" height="70" rx="12"/>
  <text class="label" x="797" y="1348">Özel Git Deposu</text>
  <text class="small" x="797" y="1370">Kaynak + CI tanımı</text>

  <rect class="node-tool" x="975" y="1320" width="245" height="70" rx="12"/>
  <text class="label" x="1097" y="1348">Bulut macOS / Xcode</text>
  <text class="small" x="1097" y="1370">Build + signing + upload</text>

