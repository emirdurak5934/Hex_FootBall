<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1640" viewBox="0 0 1600 1640" role="img" aria-labelledby="title desc">
  <title id="title">FootballDatabase V2 iş akışı ve mimari şeması</title>
  <desc id="desc">Kullanıcıdan Flask ve Socket.IO katmanlarına, oyun modlarına, veri kaynaklarına, hesap sistemine ve Windows üzerinden iPhone cihaz testine uzanan proje akışı.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#667085"/>
    </marker>
    <style>
      .bg { fill: #f7f9fc; }
      .title { font: 700 34px Arial, sans-serif; fill: #172b4d; text-anchor: middle; }
      .subtitle { font: 400 17px Arial, sans-serif; fill: #667085; text-anchor: middle; }
      .section { font: 700 19px Arial, sans-serif; fill: #344054; }
      .node { fill: #0969a9; stroke: #075985; stroke-width: 2; }
      .node-alt { fill: #0f766e; stroke: #115e59; stroke-width: 2; }
      .node-data { fill: #7c3aed; stroke: #6d28d9; stroke-width: 2; }
      .node-tool { fill: #b45309; stroke: #92400e; stroke-width: 2; }
      .node-start { fill: #073b66; stroke: #062f52; stroke-width: 2; }
      .node-end { fill: #15803d; stroke: #166534; stroke-width: 2; }
      .decision { fill: #58b968; stroke: #348a46; stroke-width: 2; }
      .label { font: 600 15px Arial, sans-serif; fill: #fff; text-anchor: middle; }
      .small { font: 400 13px Arial, sans-serif; fill: #fff; text-anchor: middle; }
      .edge { fill: none; stroke: #667085; stroke-width: 2; marker-end: url(#arrow); }
      .edge-dash { fill: none; stroke: #98a2b3; stroke-width: 2; stroke-dasharray: 7 6; marker-end: url(#arrow); }
      .edge-label { font: 600 13px Arial, sans-serif; fill: #475467; text-anchor: middle; }
      .group { fill: #fff; stroke: #d0d5dd; stroke-width: 2; rx: 18; }
    </style>
  </defs>

  <rect class="bg" width="1600" height="1480"/>
  <text class="title" x="800" y="48">FOOTBALLDATABASE V2 — YAŞAYAN İŞ AKIŞI</text>
  <text class="subtitle" x="800" y="78">Her yeni modül ve geliştirmeden sonra güncellenecek ana proje haritası</text>

  <text class="section" x="55" y="125">ÇALIŞAN UYGULAMA</text>
  <rect class="group" x="40" y="140" width="1520" height="630"/>

  <rect class="node-start" x="650" y="165" width="300" height="68" rx="34"/>
  <text class="label" x="800" y="194">Kullanıcı / Tarayıcı / iOS Uygulaması</text>
  <text class="small" x="800" y="208">Başlatıcı: server_olusturucu.py</text>
  <text class="small" x="800" y="223">Cloudflare HTTPS tüneli veya yerel ağ</text>

  <path class="edge" d="M730 233 L555 285"/>
  <path class="edge" d="M870 233 L1045 285"/>

  <rect class="node" x="390" y="285" width="330" height="82" rx="12"/>
  <text class="label" x="555" y="318">Flask HTTP Katmanı</text>
  <text class="small" x="555" y="340">server/ üzerinden sayfalar, API ve oturum — app.py</text>

  <rect class="node-alt" x="880" y="285" width="330" height="82" rx="12"/>
  <text class="label" x="1045" y="318">Socket.IO Katmanı</text>
  <text class="small" x="1045" y="340">server/ üzerinden oda, eşleşme, davet ve rövanş</text>

